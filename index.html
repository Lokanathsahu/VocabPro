<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VocabPro – Stage 1</title>
<style>
:root{--p:#1976D2;--s:#2196F3;--bg:#f3f6fa;--c:#fff;--t:#1d2733;--m:#66727f;--b:#e1e6ec;--ok:#2e9e5b;--er:#d64545}
[data-theme=dark]{--bg:#0f1720;--c:#18232f;--t:#e6edf3;--m:#93a1b0;--b:#2a3846}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit;color:inherit}h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:0 0 10px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px}.btn:hover{background:var(--s)}.btn.g{background:var(--c);color:var(--p);border:1px solid var(--b)}.btn.r{background:var(--er)}.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--s);outline-offset:2px}
.card{background:var(--c);border-radius:14px;box-shadow:0 1px 4px rgba(20,40,70,.1);padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--c);margin:4px 0 10px}
label{font-size:13px;color:var(--m)}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat b{display:block;font-size:26px;color:var(--p)}.stat span{color:var(--m);font-size:13px}
#app{display:flex;min-height:100vh}nav{background:var(--c);border-right:1px solid var(--b);width:210px;padding:14px;position:sticky;top:0;height:100vh}
nav .logo{font-weight:700;color:var(--p);font-size:19px;margin-bottom:14px}nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer}nav button.on{background:var(--p);color:#fff}
main{flex:1;min-width:0;padding:18px;max-width:900px;margin:auto}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:rgba(33,150,243,.15);color:var(--p)}
.w{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--b);padding:10px 0}.w:last-child{border:0}.m{color:var(--m);font-size:13px}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:2px solid var(--b);border-radius:10px;padding:12px;margin:6px 0;cursor:pointer}.opt.on{border-color:var(--p);background:rgba(33,150,243,.12)}.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--er)}
.qn button{width:34px;height:34px;border-radius:8px;border:1px solid var(--b);background:var(--c);cursor:pointer;margin:2px}.qn .a{background:var(--p);color:#fff}.qn .f{outline:2px solid #f0a500}.qn .cur{border:2px solid var(--t)}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);transition:width .2s}.ind i{width:35%;animation:ind 1.2s infinite alternate}@keyframes ind{to{margin-left:65%}}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;display:none}
#off{background:#f0a500;color:#000;text-align:center;padding:4px;font-size:13px;display:none}
.hide{display:none!important}
@media(max-width:760px){nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;padding:4px;border-top:1px solid var(--b);border-right:0;z-index:5}nav .logo{display:none}nav button{text-align:center;font-size:11px;padding:8px 2px}main{padding:12px 12px 84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="off">You're offline – showing cached words. Changes need a connection.</div>
<div id="root"></div><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,query,where,orderBy,limit,getDocs,startAfter,runTransaction,addDoc,serverTimestamp,getCountFromServer}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE (only place) =====
const firebaseConfig={apiKey:"AIzaSyC8rXJL5__GaDd2eC4PqlJTY5qJe2vLsfg",authDomain:"my-applicationaecond.firebaseapp.com",projectId:"my-applicationaecond",appId:"1:123574375423:web:8ee16a5c9756acb1f48dca"};
// ========================================================
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={u:null,words:[],map:new Map(),view:"dashboard",results:null,pg:0,q:"",sort:"recent",cat:"",bulk:[],sync:"idle"};
const CATS=["Banking","SSC","Railway","Other"],PER=15;
const toast=(m,e)=>{const t=$("#toast");t.textContent=m;t.style.background=e?"var(--er)":"";t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3200)};
const list=s=>[...new Set(String(s||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean))];
const slug=w=>w.toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtD=t=>new Date(t).toLocaleDateString();

// ---------- IndexedDB cache (per-UID keys) ----------
let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("vocabpro",1);r.onupgradeneeded=()=>{r.result.createObjectStore("words",{keyPath:"key"});r.result.createObjectStore("meta",{keyPath:"uid"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const run=async(st,mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,mode),s=t.objectStore(st);let out;try{out=fn(s)}catch(e){return rej(e)}t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=t.onabort=()=>rej(t.error)})};
const cacheWords=async uid=>(await run("words","readonly",s=>s.getAll())).filter(x=>x.key.startsWith(uid+"|"));
const cachePut=(uid,ws)=>run("words","readwrite",s=>ws.forEach(w=>s.put({...w,key:uid+"|"+w.id})));
const cacheDel=(uid,ids)=>run("words","readwrite",s=>ids.forEach(i=>s.delete(uid+"|"+i)));
const getMeta=uid=>run("meta","readonly",s=>s.get(uid));
const setMeta=(uid,m)=>run("meta","readwrite",s=>s.put({uid,...m}));
const clearCache=async uid=>{const ks=(await cacheWords(uid)).map(w=>w.id);await cacheDel(uid,ks);await run("meta","readwrite",s=>s.delete(uid))};
const setWords=a=>{S.words=a.filter(w=>!w.deleted);S.map=new Map(S.words.map(w=>[w.id,w]))};

// ---------- Firestore paths ----------
const wCol=()=>collection(db,"users",S.u.uid,"words"),syncRef=()=>doc(db,"users",S.u.uid,"metadata","sync");

// ---------- Synchronisation ----------
async function sync(force){
  const uid=S.u.uid;let meta=await getMeta(uid).catch(()=>null);
  try{setWords(await cacheWords(uid))}catch(e){console.warn("IndexedDB unavailable",e);meta=null}
  const fresh=!meta||force;let local=fresh?0:meta.ver;
  if(!navigator.onLine){S.sync="offline";return}
  try{
    const sv=(await getDoc(syncRef())).data()?.version||0;
    if(!fresh&&sv===local){S.sync="ok";return}
    S.sync="busy";const first=local===0;let n=0,total=null,maxV=sv;
    if(first){showSync(0,null);try{total=(await getCountFromServer(query(wCol(),where("v",">",0)))).data().count}catch{}}
    let cur=null;
    for(;;){
      const q=query(wCol(),where("v",">",local),orderBy("v"),limit(200),...(cur?[startAfter(cur)]:[]));
      const snap=await getDocs(q);if(snap.empty)break;
      const up=[],del=[];snap.forEach(d=>{const w={id:d.id,...d.data()};maxV=Math.max(maxV,w.v||0);w.deleted?del.push(w.id):up.push(w)});
      await cachePut(uid,up).catch(()=>{});await cacheDel(uid,del).catch(()=>{});
      n+=snap.size;cur=snap.docs[snap.docs.length-1];if(first)showSync(n,total);if(snap.size<200)break;
    }
    await setMeta(uid,{ver:maxV,syncedAt:Date.now()}).catch(()=>{});
    setWords(await cacheWords(uid));S.sync="ok";
  }catch(e){console.error(e);S.sync="error";toast("Sync failed: "+(e.code||e.message),1)}
}
function showSync(n,total){const pct=total?Math.min(100,Math.round(n/total*100)):null;
  $("#root").innerHTML=`<div class="center"><h1>Downloading your words...</h1><div style="width:min(340px,90%)"><div class="bar ${pct===null?"ind":""}"><i style="width:${pct??35}%"></i></div></div><p>${n} word${n==1?"":"s"} downloaded${total?` of ${total} (${pct}%)`:""}</p></div>`}

// Atomic write: bumps sync version and stamps each changed word with it.
async function write(items){ // items:[{id,data}] merged into words/{id}
  if(!navigator.onLine)throw new Error("You're offline. Reconnect to save changes.");
  const uid=S.u.uid;let nv;
  for(let i=0;i<items.length;i+=400){
    const part=items.slice(i,i+400);
    nv=await runTransaction(db,async tx=>{
      const cur=(await tx.get(syncRef())).data()?.version||0,v=cur+1;
      part.forEach(it=>tx.set(doc(wCol(),it.id),{...it.data,v},{merge:true}));
      tx.set(syncRef(),{version:v,updatedAt:serverTimestamp()});return v});
    const up=[],del=[];
    part.forEach(it=>{if(it.data.deleted)del.push(it.id);else up.push({...(S.map.get(it.id)||{id:it.id}),...it.data,id:it.id,v:nv})});
    await cachePut(uid,up).catch(()=>{});await cacheDel(uid,del).catch(()=>{});
    del.forEach(id=>S.map.delete(id));up.forEach(w=>S.map.set(w.id,w));setWords([...S.map.values()]);
    const m=await getMeta(uid).catch(()=>null);
    if(m&&m.ver===nv-1)await setMeta(uid,{...m,ver:nv}).catch(()=>{});else sync(); // other device changed data: pull it
  }
}
const fromForm=f=>({word:f.word.trim(),meaning:(f.meaning||"").trim(),syn:list(f.syn),ant:list(f.ant),ex:(f.ex||"").trim(),cat:f.cat||"Other",src:(f.src||"").trim()});
const okWord=w=>/^[A-Za-z][A-Za-z '\-]{0,59}$/.test(w);

// ---------- Auth ----------
$("#root").innerHTML='<div class="center">Loading…</div>';
onAuthStateChanged(auth,async u=>{
  if(!u){S.u=null;setWords([]);S.results=null;return loginView()}
  S.u=u;$("#root").innerHTML='<div class="center">Loading…</div>';
  try{const r=doc(db,"users",u.uid);const ex=(await getDoc(r)).exists();
    await setDoc(r,{uid:u.uid,name:u.displayName||"",email:u.email||"",photo:u.photoURL||"",lastLoginAt:serverTimestamp(),...(ex?{}:{createdAt:serverTimestamp(),prefs:{theme:"light"}})},{merge:true})}catch(e){console.warn(e)}
  await sync();shell();go("dashboard");
});
function loginView(){$("#root").innerHTML=`<div class="center"><h1 style="color:var(--p);font-size:30px">VocabPro</h1><p class="m">Build your vocabulary for Banking, SSC and Railway exams.</p><button class="btn" id="gl">Continue with Google</button></div>`;
  $("#gl").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast("Login failed: "+e.code,1))}
const NAV=[["dashboard","Home"],["add","Add"],["words","Words"],["bookmarks","Saved"],["practice","Practice"],["revision","Revise"],["settings","Settings"]];
function shell(){$("#root").innerHTML=`<div id="app"><nav><div class="logo">VocabPro</div>${NAV.map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join("")}</nav><main id="main"></main></div>`;
  document.querySelector("nav").onclick=e=>{const g=e.target.dataset.go;if(g){if(Q&&Q.on&&!confirm("Leave the quiz? Progress will be lost."))return;stopQ();go(g)}}}
function go(v){S.view=v;S.pg=0;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===v||(v==="quiz"||v==="result")&&b.dataset.go==="practice"));
  $("#main").innerHTML=V[v]();(A[v]||(()=>{}))();window.scrollTo(0,0)}
addEventListener("online",()=>{$("#off").style.display="none";if(S.u)sync().then(()=>S.view!=="quiz"&&go(S.view))});
addEventListener("offline",()=>$("#off").style.display="block");if(!navigator.onLine)$("#off").style.display="block";
if(localStorage.theme==="dark")document.documentElement.dataset.theme="dark";

// ---------- Views ----------
const wordForm=(w={})=>`<label>English word *</label><input id="f_word" maxlength="60" value="${esc(w.word)}" ${w.id?"readonly":""}>
<label>Meaning (optional)</label><input id="f_meaning" value="${esc(w.meaning)}"><label>Synonyms (comma separated)</label><input id="f_syn" value="${esc((w.syn||[]).join(", "))}">
<label>Antonyms (comma separated)</label><input id="f_ant" value="${esc((w.ant||[]).join(", "))}"><label>Example sentence</label><textarea id="f_ex" rows="2">${esc(w.ex)}</textarea>
<label>Exam category</label><select id="f_cat">${CATS.map(c=>`<option ${w.cat===c?"selected":""}>${c}</option>`).join("")}</select><label>Source</label><input id="f_src" value="${esc(w.src)}" placeholder="e.g. The Hindu editorial">`;
const readForm=()=>fromForm({word:$("#f_word").value,meaning:$("#f_meaning").value,syn:$("#f_syn").value,ant:$("#f_ant").value,ex:$("#f_ex").value,cat:$("#f_cat").value,src:$("#f_src").value});
const wordRow=w=>`<div class="w"><div><b>${esc(w.word)}</b> <span class="tag">${esc(w.cat)}</span><div>${esc(w.meaning)||'<span class="m">No meaning yet</span>'}</div>${w.syn?.length?`<div class="m">Syn: ${esc(w.syn.join(", "))}</div>`:""}${w.ant?.length?`<div class="m">Ant: ${esc(w.ant.join(", "))}</div>`:""}${w.ex?`<div class="m"><i>${esc(w.ex)}</i></div>`:""}<div class="m">${fmtD(w.added)}${w.src?" · "+esc(w.src):""}</div></div>
<div class="row" style="flex-direction:column;align-items:flex-end"><button class="btn sm g" data-bm="${w.id}">${w.bookmarked?"★ Saved":"☆ Save"}</button><button class="btn sm g" data-ed="${w.id}">Edit</button><button class="btn sm r" data-del="${w.id}">Delete</button></div></div>`;
const empty=(t,b,g)=>`<div class="card center" style="min-height:200px"><p>${t}</p>${b?`<button class="btn" data-go2="${g}">${b}</button>`:""}</div>`;
const V={
dashboard(){const today=new Date().setHours(0,0,0,0),tw=S.words.filter(w=>w.added>=today).length,bm=S.words.filter(w=>w.bookmarked).length,rec=[...S.words].sort((a,b)=>b.added-a.added).slice(0,5);
  return`<h1>Welcome, ${esc((S.u.displayName||"learner").split(" ")[0])}</h1><div class="grid"><div class="card stat"><b>${S.words.length}</b><span>Saved words</span></div><div class="card stat"><b>${tw}</b><span>Added today</span></div><div class="card stat"><b>${bm}</b><span>Bookmarked</span></div><div class="card stat" id="tstat"><b>…</b><span>Tests taken</span></div></div>
  <div class="row" style="margin-bottom:14px"><button class="btn" data-go2="add">Quick add word</button><button class="btn g" data-go2="practice">Start practice</button></div>
  <div class="card"><h2>Recent activity</h2>${rec.length?rec.map(w=>`<div class="w"><span><b>${esc(w.word)}</b> <span class="m">added ${fmtD(w.added)}</span></span></div>`).join(""):'<p class="m">No words yet. Add your first word to begin.</p>'}</div><div class="card" id="tprog"><h2>Progress</h2><p class="m">Loading test history…</p></div>`},
add(){return`<h1>Add vocabulary</h1><div class="card">${wordForm()}<div class="row"><button class="btn" id="save">Save word</button><button class="btn g" id="clr">Clear form</button></div></div>
<div class="card"><h2>Bulk add</h2><p class="m">One word per line: <code>word | meaning | synonyms (comma) | antonyms (comma)</code>. Only the word is required.</p><textarea id="bulk" rows="6" placeholder="abate | to reduce | subside, lessen | increase"></textarea><select id="bcat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><button class="btn g" id="prev">Preview</button><div id="bprev"></div></div>`},
words(){const f=S.words.filter(w=>(!S.cat||w.cat===S.cat)&&(!S.q||(w.word+" "+w.meaning+" "+w.syn?.join(" ")).toLowerCase().includes(S.q.toLowerCase())));
  f.sort(S.sort==="az"?(a,b)=>a.word.localeCompare(b.word):(a,b)=>b.added-a.added);const pages=Math.max(1,Math.ceil(f.length/PER));S.pg=Math.min(S.pg,pages-1);
  return`<h1>My words (${f.length})</h1><div class="row"><input id="sq" placeholder="Search" value="${esc(S.q)}" style="flex:2"><select id="ss" style="flex:1"><option value="recent">Recent first</option><option value="az" ${S.sort==="az"?"selected":""}>A–Z</option></select><select id="sc" style="flex:1"><option value="">All exams</option>${CATS.map(c=>`<option ${S.cat===c?"selected":""}>${c}</option>`).join("")}</select></div>
  <div class="card" id="wl">${f.length?f.slice(S.pg*PER,S.pg*PER+PER).map(wordRow).join(""):'<p class="m">No words match. Add words or change filters.</p>'}</div>
  <div class="row" style="justify-content:center"><button class="btn g sm" data-pg="-1" ${S.pg<1?"disabled":""}>Prev</button><span>${S.pg+1}/${pages}</span><button class="btn g sm" data-pg="1" ${S.pg>=pages-1?"disabled":""}>Next</button></div>`},
bookmarks(){const b=S.words.filter(w=>w.bookmarked);return`<h1>Bookmarks (${b.length})</h1>${b.length?`<div class="card">${b.map(wordRow).join("")}</div>`:empty("Bookmark words from My Words to see them here.","Go to My Words","words")}`},
practice(){const n=S.words.length;return`<h1>Practice centre</h1><div class="card"><p class="m">Questions use only your saved words (${n}). Each question type needs words with that data filled in.</p>
  <label>Type</label><select id="pt"><option value="meaning">Meaning</option><option value="syn">Synonyms</option><option value="ant">Antonyms</option></select><label>Questions</label><select id="pc"><option>10</option><option>20</option><option>30</option><option>50</option></select>
  <label>Difficulty (sets time per question: easy 60s, medium 40s, hard 25s)</label><select id="pd"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><label><input type="checkbox" id="ptm" style="width:auto"> Use timer</label><br><br><button class="btn" id="go">Start quiz</button></div>`},
quiz(){const q=Q.qs[Q.i],a=Q.ans[Q.i];return`<div class="row" style="justify-content:space-between"><b>Q ${Q.i+1}/${Q.qs.length}</b><b id="tm"></b></div><div class="bar"><i style="width:${(Q.ans.filter(x=>x!=null).length/Q.qs.length)*100}%"></i></div>
  <div class="card" style="margin-top:12px"><h2>${esc(q.q)}</h2>${q.o.map((o,i)=>`<button class="opt ${a===i?"on":""}" data-o="${i}">${esc(o)}</button>`).join("")}<div class="row"><button class="btn g sm" data-qn="-1" ${Q.i?"":"disabled"}>Previous</button><button class="btn g sm" data-qn="1" ${Q.i<Q.qs.length-1?"":"disabled"}>Next</button><button class="btn g sm" id="mk">${Q.rev.has(Q.i)?"Unmark review":"Mark for review"}</button><button class="btn sm" id="sub">Submit</button></div></div>
  <div class="card qn">${Q.qs.map((_,i)=>`<button data-j="${i}" class="${Q.ans[i]!=null?"a":""} ${Q.rev.has(i)?"f":""} ${i===Q.i?"cur":""}">${i+1}</button>`).join("")}<p class="m">Blue = answered, orange outline = marked for review.</p></div>`},
result(){const r=Q.res;return`<h1>Test results</h1><div class="grid"><div class="card stat"><b>${r.score}/${r.total}</b><span>Score</span></div><div class="card stat"><b>${r.acc}%</b><span>Accuracy</span></div><div class="card stat"><b>${r.correct}</b><span>Correct</span></div><div class="card stat"><b>${r.wrong}</b><span>Wrong</span></div><div class="card stat"><b>${r.skipped}</b><span>Skipped</span></div><div class="card stat"><b>${Math.floor(r.time/60)}m ${r.time%60}s</b><span>Time taken</span></div></div>
  <p class="m" id="svs">${r.saved?"Result saved.":"Saving result…"}</p><div class="card"><h2>Review</h2>${r.items.map((it,i)=>`<div class="w"><div><b>${i+1}. ${esc(it.q)}</b>${it.o.map((o,j)=>`<div class="m" style="color:${j===it.ans?"var(--ok)":j===it.sel?"var(--er)":"inherit"}">${j===it.ans?"✓":j===it.sel?"✗":"•"} ${esc(o)}</div>`).join("")}${it.sel==null?'<div class="m">Skipped</div>':""}${it.exp?`<div class="m"><i>${esc(it.exp)}</i></div>`:""}</div></div>`).join("")}</div><button class="btn" data-go2="practice">Practice again</button>`},
revision(){const bm=S.words.filter(w=>w.bookmarked);return`<h1>Revision</h1><div class="card"><h2>Bookmarked words (${bm.length})</h2>${bm.length?bm.map(w=>`<details class="w" style="display:block"><summary><b>${esc(w.word)}</b></summary>${esc(w.meaning)||"No meaning saved"}<div class="m">${esc((w.syn||[]).join(", "))}</div><div class="m"><i>${esc(w.ex)}</i></div></details>`).join(""):'<p class="m">No bookmarks yet.</p>'}</div><div class="card" id="wrongs"><h2>Words you answered wrong</h2><p class="m">Loading…</p></div>`},
settings(){const m=S.sync;return`<h1>Settings</h1><div class="card"><div class="row">${S.u.photoURL?`<img src="${esc(S.u.photoURL)}" width="44" height="44" style="border-radius:50%" referrerpolicy="no-referrer">`:""}<div><b>${esc(S.u.displayName)}</b><div class="m">${esc(S.u.email)}</div></div></div></div>
  <div class="card"><p class="m">Sync status: ${m}. Cached words: ${S.words.length}.</p><div class="row"><button class="btn g" id="th">Toggle dark mode</button><button class="btn g" id="rs">Re-download from server</button><button class="btn g" id="cc">Clear local cache</button><button class="btn r" id="lo">Log out</button></div><p class="m">Logging out never deletes your cloud data.</p></div>`}};

// ---------- Actions ----------
const A={
dashboard(){loadRes().then(r=>{const t=$("#tstat b");if(!t)return;t.textContent=r.length;const avg=r.length?Math.round(r.reduce((s,x)=>s+x.acc,0)/r.length):0;$("#tprog").innerHTML=`<h2>Progress</h2><p>${r.length?`Last ${r.length} tests: average accuracy <b>${avg}%</b>. Latest: ${r[0].score}/${r[0].total} (${r[0].type}).`:"No tests yet. Take a practice quiz to track progress."}</p>`}).catch(()=>{const t=$("#tstat b");if(t)t.textContent="–";$("#tprog").innerHTML="<h2>Progress</h2><p class='m'>Test history unavailable offline.</p>"})},
add(){$("#clr").onclick=()=>go("add");
  $("#save").onclick=async()=>{const w=readForm();if(!okWord(w.word))return toast("Enter a valid English word (letters, spaces, hyphens).",1);
    const id=slug(w.word);if(S.map.has(id)&&!confirm(`"${w.word}" already exists. Overwrite it?`))return;
    const old=S.map.get(id);$("#save").disabled=true;
    try{await write([{id,data:{...w,added:old?.added||Date.now(),bookmarked:old?.bookmarked||false}}]);toast("Word saved & synced.");go("add")}catch(e){toast(e.message,1);$("#save").disabled=false}};
  $("#prev").onclick=()=>{const seen=new Set();S.bulk=[];let bad=0;$("#bulk").value.split("\n").forEach(l=>{if(!l.trim())return;const[p,m,s,a]=l.split("|").map(x=>x.trim());const w=fromForm({word:p,meaning:m,syn:s,ant:a,cat:$("#bcat").value,src:"Bulk add"}),id=slug(p||"");
      if(!okWord(w.word)||!id||seen.has(id)){bad++;return}seen.add(id);S.bulk.push({id,w,dup:S.map.has(id)})});
    $("#bprev").innerHTML=`<p>${S.bulk.length} valid, ${bad} skipped (invalid/duplicate lines), ${S.bulk.filter(x=>x.dup).length} already saved (will be skipped).</p>${S.bulk.slice(0,50).map(x=>`<div class="m">${x.dup?"⚠":"✓"} ${esc(x.w.word)} – ${esc(x.w.meaning)}</div>`).join("")}<button class="btn" id="bs" ${S.bulk.some(x=>!x.dup)?"":"disabled"}>Save ${S.bulk.filter(x=>!x.dup).length} words</button>`;
    const bs=$("#bs");if(bs)bs.onclick=async()=>{bs.disabled=true;try{const now=Date.now();await write(S.bulk.filter(x=>!x.dup).map((x,i)=>({id:x.id,data:{...x.w,added:now+i,bookmarked:false}})));toast("Words saved & synced.");go("words")}catch(e){toast(e.message,1);bs.disabled=false}}}},
words(){const re=()=>{const y=scrollY;go("words");scrollTo(0,y)};let t;$("#sq").oninput=e=>{S.q=e.target.value;clearTimeout(t);t=setTimeout(()=>{const p=S.pg;go("words");$("#sq").focus();$("#sq").setSelectionRange(99,99)},250)};
  $("#ss").onchange=e=>{S.sort=e.target.value;re()};$("#sc").onchange=e=>{S.cat=e.target.value;re()}},
revision(){loadRes().then(r=>{const ids=new Set(r.flatMap(x=>x.wrongIds||[])),ws=[...ids].map(i=>S.map.get(i)).filter(Boolean);$("#wrongs").innerHTML=`<h2>Words you answered wrong (${ws.length})</h2>${ws.length?ws.map(w=>`<details class="w" style="display:block"><summary><b>${esc(w.word)}</b></summary>${esc(w.meaning)||"No meaning saved"}<div class="m">${esc((w.syn||[]).join(", "))}</div></details>`).join(""):'<p class="m">Nothing here yet.</p>'}`}).catch(()=>$("#wrongs").innerHTML="<h2>Words you answered wrong</h2><p class='m'>Unavailable offline.</p>")},
practice(){$("#go").onclick=()=>{const t=$("#pt").value,n=+$("#pc").value,d=$("#pd").value,qs=build(t,n);if(qs.length<5)return toast("Not enough complete words. Add meanings/synonyms/antonyms to at least 5 words (4+ distinct wrong options needed).",1);
  if(qs.length<n)toast(`Only ${qs.length} valid questions available.`);startQ(qs,t,d,$("#ptm").checked)}},
quiz(){tick();$("#mk").onclick=()=>{Q.rev.has(Q.i)?Q.rev.delete(Q.i):Q.rev.add(Q.i);go("quiz")};$("#sub").onclick=()=>{const un=Q.ans.filter(x=>x==null).length;if(confirm(un?`${un} unanswered. Submit anyway?`:"Submit test?"))finish()}},
settings(){$("#th").onclick=()=>{const d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.theme=d?"light":"dark"};
  $("#lo").onclick=()=>signOut(auth);$("#cc").onclick=async()=>{await clearCache(S.u.uid);setWords([]);toast("Local cache cleared. Use Re-download to rebuild.");go("settings")};
  $("#rs").onclick=async()=>{await sync(true);go("settings")}}};
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t||!S.u)return;const d=t.dataset;
  if(d.go2)return go(d.go2);
  if(d.pg){S.pg+=+d.pg;return go("words")}
  if(d.bm){const w=S.map.get(d.bm);try{await write([{id:w.id,data:{bookmarked:!w.bookmarked}}]);go(S.view)}catch(x){toast(x.message,1)}}
  if(d.del&&confirm("Delete this word?")){try{await write([{id:d.del,data:{deleted:true}}]);toast("Deleted.");go(S.view)}catch(x){toast(x.message,1)}}
  if(d.ed){const w=S.map.get(d.ed);$("#main").innerHTML=`<h1>Edit word</h1><div class="card">${wordForm(w)}<div class="row"><button class="btn" id="eu">Update</button><button class="btn g" id="ec">Cancel</button></div></div>`;$("#ec").onclick=()=>go(S.view);
    $("#eu").onclick=async()=>{const f=readForm();try{await write([{id:w.id,data:{...f,word:w.word}}]);toast("Updated.");go(S.view)}catch(x){toast(x.message,1)}}}
  if(S.view==="quiz"&&Q.on){if(d.o!=null){Q.ans[Q.i]=+d.o;go("quiz")}if(d.qn){Q.i+=+d.qn;go("quiz")}if(d.j!=null){Q.i=+d.j;go("quiz")}}});

// ---------- Quiz ----------
let Q=null;const stopQ=()=>{if(Q){Q.on=false;clearInterval(Q.iv)}};
function build(type,n){let pool=S.words.filter(w=>type==="meaning"?w.meaning:w[type]?.length);
  const bank=type==="meaning"?S.words.filter(w=>w.meaning).map(w=>w.meaning):[...new Set(S.words.flatMap(w=>[...(w.syn||[]),...(w.ant||[])]))];
  const qs=[];shuffle(pool).forEach(w=>{const ok=type==="meaning"?[w.meaning]:w[type],bad=new Set(type==="meaning"?[w.meaning]:[...(w.syn||[]),...(w.ant||[])].map(x=>x.toLowerCase()));
    const ds=shuffle(bank.filter(x=>!bad.has(x.toLowerCase()))).slice(0,3);if(ds.length<3)return;
    const c=ok[Math.random()*ok.length|0],o=shuffle([c,...ds]);
    qs.push({id:w.id,q:type==="meaning"?`What is the meaning of "${w.word}"?`:`Choose a ${type==="syn"?"synonym":"antonym"} of "${w.word}"`,o,ans:o.indexOf(c),exp:w.meaning?`${w.word}: ${w.meaning}`:(type==="syn"?"Synonyms: ":"Antonyms: ")+ok.join(", ")})});return qs.slice(0,n)}
function startQ(qs,type,diff,timed){const per={easy:60,medium:40,hard:25}[diff];Q={on:true,qs,type,diff,i:0,ans:qs.map(()=>null),rev:new Set(),start:Date.now(),limit:timed?qs.length*per:0};go("quiz")}
function tick(){clearInterval(Q.iv);const el=()=>{const s=Math.floor((Date.now()-Q.start)/1000),t=$("#tm");if(Q.limit&&s>=Q.limit){clearInterval(Q.iv);toast("Time's up!");return finish()}if(t)t.textContent=Q.limit?`⏱ ${Math.max(0,Q.limit-s)}s left`:`⏱ ${s}s`};el();Q.iv=setInterval(el,1000)}
async function finish(){clearInterval(Q.iv);Q.on=false;const time=Math.floor((Date.now()-Q.start)/1000);let correct=0,wrong=0,skipped=0;const wrongIds=[];
  Q.qs.forEach((q,i)=>{const a=Q.ans[i];if(a==null)skipped++;else if(a===q.ans)correct++;else{wrong++;wrongIds.push(q.id)}});
  const total=Q.qs.length,r={type:Q.type,diff:Q.diff,total,correct,wrong,skipped,score:correct,acc:total?Math.round(correct/total*100):0,time,wrongIds,items:Q.qs.map((q,i)=>({id:q.id,q:q.q,o:q.o,ans:q.ans,sel:Q.ans[i],exp:q.exp}))};
  Q.res=r;go("result");
  try{await addDoc(collection(db,"users",S.u.uid,"testResults"),{...r,created:serverTimestamp()});r.saved=true;S.results=null;$("#svs").textContent="Result saved."}catch(e){$("#svs").textContent="Could not save result: "+(e.code||e.message)}}
async function loadRes(){if(S.results)return S.results;const s=await getDocs(query(collection(db,"users",S.u.uid,"testResults"),orderBy("created","desc"),limit(10)));return S.results=s.docs.map(d=>d.data())}
</script></body></html>
